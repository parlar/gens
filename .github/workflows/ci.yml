# This workflow installs Gens and runs test suite
name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]

jobs:
  python-unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every version the package advertises support for, so the metadata is
        # backed by a run rather than by hope.
        python-version: ["3.11", "3.12"]
        mongodb-version: ["7"]

    steps:
    - uses: actions/checkout@v6
    # Set up python
    - name: Set up Python ${{ matrix.python-version}}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version}}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt
    - name: Run pytest
      run: |
        pytest tests
  
  api-types:
    name: Generated API types are current
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v6
      with:
        node-version: 20.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        npm ci
    # frontend/js/types.ts aliases its Api* types to this generated file, so a
    # route or model change that is not regenerated leaves TypeScript vouching
    # for a response shape the server no longer sends.
    - run: npm run types:api:check

  distribution:
    name: The built distribution installs and imports
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v6
      with:
        node-version: 20.x
    # The compiled assets are gitignored, so a fresh checkout has none. They
    # have to exist before the build for the check to mean anything.
    - name: Build the frontend
      run: |
        npm ci
        npm run buildcp
    # Builds an sdist, builds a wheel from that sdist, installs it outside the
    # checkout and imports the application. The wheel built directly from a
    # checkout was fine while the source archive contained no Python at all.
    - run: ./utils/check_distribution.sh

  js-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        # cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm run test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # This passes on dev and has for a while, so failing on it costs nothing
    # today and stops the next regression landing unnoticed. tsconfig sets
    # strictNullChecks, so this now catches an unhandled null as well as a
    # missing property or a wrong shape; the rest of "strict" is still off.
    - run: npm run typecheck

  es-lint:
    name: ESLint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint

  pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt
    - name: Analysing the code with pylint
      run: |
        pylint --fail-under 9 gens

  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt
    - name: Analysing the code with mypy
      run: |
        mypy gens
