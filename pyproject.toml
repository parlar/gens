[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Gens"
dynamic = ["version"]
description = 'Visualise copy number profiles from WGS data'
readme = "README.md"
# 3.11 is where StrEnum and stdlib tomllib arrive, both of which are used on
# the import path. Measured: 3.11 imports the installed package, 3.10 does not.
# This said >=3.8, so pip would install onto an interpreter that cannot import
# it and the failure landed at runtime instead of at install time.
requires-python = ">=3.11"
license = "MIT"
keywords = ["WGS", "scout", "CNV", "cancer", "rare disease", "variant", "NGS", "browser"]
authors = [
  { name = "Markus Johansson", email = "markus.h.johansson@skane.se" },
  { name = "Jakob Willforss", email = "jakob.willforss@skane.se" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  # Only versions the test suite runs on are listed. See the CI matrix.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "Click",
  "Flask",
  "flask_login",
  "authlib",
  "ldap3",
  "pymongo",
  "pysam",
  "fastapi",
  "flask-compress",
  "pydantic[email]",
  "pydantic-settings",
  "pydantic-extra-types",
  "gunicorn",
  "uvicorn",
  "asgiref",
  "requests",
  "PyYAML",
]

[project.urls]
Documentation = "https://github.com/SMD-Bioinformatics-Lund/gens#readme"
Issues = "https://github.com/SMD-Bioinformatics-Lund/gens/issues"
Changelog = "https://github.com/SMD-Bioinformatics-Lund/gens/blob/master/CHANGELOG.md"

[project.scripts]
gens = "gens.cli:cli"

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
testpaths = ["tests"]

[tool.hatch.version]
path = "gens/__version__.py"

# The compiled CSS and JavaScript are build output and so are gitignored, and
# hatchling honours the ignore file. They have to be declared as artifacts to
# reach a distribution at all: `include` does not override a VCS ignore, which
# is why a locally built wheel used to contain no frontend assets. The Docker
# build never showed it, because its context has no .gitignore in it.
[tool.hatch.build]
artifacts = [
  "gens/static/**/*",
  "gens/blueprints/**/static/*",
]

[tool.hatch.build.targets.wheel]
packages = ["gens"]

# The sdist needs saying separately. Without this it inherited only the asset
# list above, which names no Python at all, so `pip install` of the source
# archive produced an importable-looking package with no modules in it; the
# wheel built directly never had the problem, which is why it went unnoticed.
[tool.hatch.build.targets.sdist]
include = [
  "gens/",
  "tests/",
  "utils/",
  "docs/",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "requirements-dev.txt",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/temporary tests}"

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["gens", "tests"]
branch = true
parallel = true
omit = [
  "gens/__version__.py",
]

[tool.coverage.paths]
gens = ["gens",]
tests = ["tests", "*/temporary/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
src_paths = ["gens"]
